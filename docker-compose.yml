services:
  # 0. Base de datos para memoria de LangGraph
  postgres:
    image: postgres:16-alpine
    container_name: postgres-agente-grupo47
    # No volcar logs a la terminal en `docker compose up`: deja limpio el chat.
    attach: false
    environment:
      - POSTGRES_DB=agente
      - POSTGRES_USER=agente
      - POSTGRES_PASSWORD=agente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente -d agente"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agente-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # 1. API Empresarial del curso (Imagen oficial del docente)
  api:
    image: julianmora27/misw4412-api-empresarial:latest
    container_name: api-empresarial-grupo47
    # Igual que postgres: sin logs en la terminal para no ensuciar el chat.
    attach: false
    ports:
      - "8080:8080"
    restart: unless-stopped

  # 2. Judge Agent (auditor del agente principal) — esqueleto inicial
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    container_name: judge-grupo47
    # Sin logs en la terminal para mantener limpio el chat.
    attach: false
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 3. Agente del Grupo 47
  agente:
    build: .
    image: saballesteros/agente-centroproyectos-misw44-grupo47-entrega:2026-20
    # Construir siempre desde el codigo actual con `docker compose up` (sin --build).
    pull_policy: build
    container_name: agente-grupo47
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      judge:
        condition: service_healthy
    environment:
      # Configuración del modelo y Ollama en el Host
      - OLLAMA_MODEL=qwen2.5:3b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Conexión interna a la API dentro del compose
      - API_BASE_URL=http://api:8080
      # URL interna del judge agent (esqueleto, aun no consumido por el agente)
      - JUDGE_BASE_URL=http://judge:8000
      - DATABASE_URL=postgresql://agente:agente@postgres:5432/agente?sslmode=disable
      - LANGGRAPH_STRICT_MSGPACK=true
      - CASO_NEGOCIO=centro_proyectos
      - GRUPO=47
      # Credenciales del RAG
      - RAG_BASE_URL=http://34.71.149.196:8000/api/v1
      - RAG_EMAIL=grupo47_centroproyectos@uniandes.edu.co
      - RAG_PASSWORD=centroproyectos178
      - RAG_COLLECTION=centro_proyectos
      # LangSmith: se lee desde .env, sin escribir la llave en el compose.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGSMITH_TRACING=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-misw4412-grupo47}
      - LANGSMITH_PROJECT=${LANGCHAIN_PROJECT:-misw4412-grupo47}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  agente-postgres:
